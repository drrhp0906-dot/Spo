<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; media-src 'self' file: blob:; script-src 'self'" />
  <title>Freewave Wallpaper</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="vis"></canvas>

  <!-- Desktop clock -->
  <div id="clock" class="widget hidden"></div>

  <!-- Now playing card -->
  <div id="card" class="widget hidden">
    <div class="card-art-wrap">
      <img id="card-art" alt="" />
      <div id="card-art-placeholder">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
      </div>
    </div>
    <div class="card-body">
      <div id="card-status" class="card-status">Playing</div>
      <div id="card-title" class="card-title">Nothing playing</div>
      <div id="card-artist" class="card-artist">Play something in Spotify, YouTube or any player</div>
      <div class="card-progress">
        <div id="card-progress-bar"></div>
      </div>
      <div class="card-times">
        <span id="card-time-cur">0:00</span>
        <span id="card-time-total">0:00</span>
      </div>
      <div id="card-lyric" class="card-lyric"></div>
    </div>
  </div>

  <div id="audio-hint" class="audio-hint hidden">
    <span id="audio-hint-text">Connecting to system audio...</span>
  </div>

  <script src="../common/audio.js"></script>
  <script src="../common/themes.js"></script>
  <script src="../common/engine.js"></script>
  <script src="../common/visualizers.js"></script>
  <script src="widgets.js"></script>
  <script src="app.js"></script>
</body>
</html>
