<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; media-src 'self' file: blob:; script-src 'self'" />
  <title>Freewave Theater</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="backdrop"></div>
  <canvas id="vis"></canvas>

  <div id="stage">
    <div id="art-wrap">
      <img id="art" alt="" />
      <div id="art-placeholder">
        <svg viewBox="0 0 24 24" width="72" height="72" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
      </div>
    </div>
    <div id="track-info">
      <div id="t-status">Playing</div>
      <div id="t-title">Nothing playing</div>
      <div id="t-artist">Play something in Spotify, YouTube or any player</div>
    </div>
  </div>

  <div id="lyrics-box">
    <div id="l-current">&nbsp;</div>
    <div id="l-next">&nbsp;</div>
  </div>

  <button id="exit-btn" title="Exit (Esc)">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>

  <script src="../common/audio.js"></script>
  <script src="../common/themes.js"></script>
  <script src="../common/engine.js"></script>
  <script src="../common/visualizers.js"></script>
  <script src="../common/lyric-sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
